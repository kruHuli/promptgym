[app]
name = "promptgym"
version = "0.1.0"
description = "Timed AI coding arena: build with an agent, graded by a judge"

[runtime.container]
image = "Dockerfile"
port = 8080
volumes = ["/var/run/docker.sock:/var/run/docker.sock"]

[routing]
health_check = "/health"
public_paths = ["/"]

[[links]]
name = "Open App"
path = "/"

[resources]
memory_mb = 1024
cpu_cores = 0.5

[data]
app_data = true

[[services.v2.consumes]]
service = "github.com/imbue-openhost/openhost/services/secrets"
shortname = "secrets"
version = ">=0.1.0"
grants = [
    {key = "OPENAI_API_KEY"},
]
